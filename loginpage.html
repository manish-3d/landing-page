<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginpage</title>
    <link rel="stylesheet" href="loginpage.css">
</head>

<body id="container">
    <video autoplay muted loop id="bg-video">
  <source src="images/8226147-uhd_4096_2160_24fps.mp4" type="video/mp4">
</video>


    <div id="logo-section">
        <img id="logo-1" src="images/image.png" height="100px" width="400px" alt="logo-section">
    </div>

    <div id="loginpage">

        <div id="login-title">
            <h1>-This is my own private daily log… and I will document it.</h1>
            <div>
                "I’m here to cook — not out of force, but out of choice.
                I’ll keep cooking for as long as it’s needed, because I was good at it.
                I understood the process, I respected the grind,
                and somewhere along the way… I started to love it."
            </div>
        </div>

        <div id="login-form">

            <div id="column1">
                <form action="userinfo.html" method="get" id="form1">

                    <div>
                        <label for="username">USER NAME-</label><br>
                        <input type="text" id="username" name="username" placeholder="Enter first name....." required>
                    </div>

                    <div>
                        <label for="last-name">LAST NAME-</label><br>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter last-name.....">
                    </div>

                    <div>
                        <label for="email">EMAIL-</label><br>
                        <input type="email" name="email" id="email" placeholder="xxxx@gmail.com">
                    </div>

                </form>
            </div>

            <div id="column2">
                <form action="userinfo.html" method="get" id="form2" style="gap: 50px;
                    display: flex;
                    flex-direction: column;">

                    <div>
                        <label for="password">PASSWORD-</label><br>
                        <input type="password" id="password" name="password" placeholder="Enter-8 digit password.....">
                    </div>

                    <div>
                        <label for="confirm-password">CONFIRM-PASSWORD-</label><br>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="confirm entered password.....">
                    </div>

                    <div>
                        <label for="phone-no">PHONE.NO-</label><br>
                        <input type="tel" id="phone-no" name="phone-no" placeholder="Enter-phone-no.....">
                    </div>

                </form>
            </div>

        </div>
        <div>
            <button style="height: 30px; width: 100px; margin-bottom: 10px; border-radius: 10px;">submit</button>
        </div>

    </div>

</body>
</html>
